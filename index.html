<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>SVG グラデーションエディタ</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<header class="app-header">
		<h1 class="app-title">SVG グラデーションエディタ</h1>
		<p class="app-subtitle">リアルタイムにグラデーションを調整し、SVGコードとして出力できます。</p>
	</header>

	<main class="app-main">
		<div class="container">
			<!-- Left Panel: Controls -->
			<div class="panel panel-left">

				<!-- Chart Type Selector -->
				<div class="control-group">
					<label class="control-label" for="chartTypeSelect">チャートタイプ</label>
					<select id="chartTypeSelect" onchange="setChartType(this.value)">
						<option value="area">エリアチャート</option>
						<option value="bar">棒グラフ</option>
						<option value="pie">円グラフ</option>
					</select>
				</div>

				<!-- Presets -->
				<div class="accordion is-open" data-accordion>
					<button class="accordion-header" type="button" data-accordion-toggle aria-expanded="true">
						<span>プリセット</span>
						<span class="accordion-icon" aria-hidden="true"></span>
					</button>
					<div class="accordion-content" data-accordion-content>
						<div class="preset-buttons">
							<button class="btn-secondary" onclick="applyPreset('oneColor')">シンプルグラデ（2色）</button>
							<button class="btn-secondary" onclick="applyPreset('multipleColors')">複雑グラデ（5色）</button>
							<button class="btn-secondary" onclick="applyPreset('coolTones')">クール系（3色）</button>
							<button class="btn-secondary" onclick="applyPreset('warmTones')">ウォーム系（3色）</button>
						</div>
					</div>
				</div>

				<!-- Gradient Direction -->
				<div class="accordion is-open" data-accordion>
					<button class="accordion-header" type="button" data-accordion-toggle aria-expanded="true">
						<span>グラデーション方向</span>
						<span class="accordion-icon" aria-hidden="true"></span>
					</button>
					<div class="accordion-content" data-accordion-content>
						<div class="coordinates-display">
							<strong>座標:</strong><br>
							<span id="coordinatesDisplay">x1: 0%, y1: 100%<br>x2: 0%, y2: 0%</span>
						</div>

						<div class="direction-controls" id="directionControls">
							<button class="btn-secondary" onclick="setDirection(270)">↑ 上</button>
							<button class="btn-secondary" onclick="setDirection(0)">→ 右</button>
							<button class="btn-secondary" onclick="setDirection(90)">↓ 下</button>
							<button class="btn-secondary" onclick="setDirection(180)">← 左</button>
						</div>

						<div class="radial-controls" id="radialControls">
							<button class="btn-secondary" data-mode="center-to-edge"
								onclick="setPieDirection('center-to-edge')">中心 → 外周</button>
							<button class="btn-secondary" data-mode="edge-to-center"
								onclick="setPieDirection('edge-to-center')">外周 → 中心</button>
						</div>

						<div class="coordinates-inputs" id="coordinatesInputs">
							<div>
								<label class="control-label">開始点 X (%)</label>
								<input type="number" id="x1Input" min="0" max="100" value="0"
									onchange="updateFromCoordinates()">
							</div>
							<div>
								<label class="control-label">開始点 Y (%)</label>
								<input type="number" id="y1Input" min="0" max="100" value="100"
									onchange="updateFromCoordinates()">
							</div>
							<div>
								<label class="control-label">終点 X (%)</label>
								<input type="number" id="x2Input" min="0" max="100" value="0"
									onchange="updateFromCoordinates()">
							</div>
							<div>
								<label class="control-label">終点 Y (%)</label>
								<input type="number" id="y2Input" min="0" max="100" value="0"
									onchange="updateFromCoordinates()">
							</div>
						</div>
					</div>
				</div>

				<!-- Gradient Stops -->
				<div class="control-group">
					<div class="section-title">カラーストップ</div>

					<div class="gradient-preview" id="gradientPreview"></div>

					<button class="btn-primary" id="addStopButton" onclick="addStop()">+ ストップを追加</button>

					<div id="stopsContainer"></div>
				</div>
			</div>

			<!-- Right Panel: Chart + Export -->
			<div class="panel panel-right">
				<div class="panel-title">プレビュー</div>
				<div class="chart-wrapper">
					<div id="chart"></div>
				</div>
				<section class="panel panel-code inline-code-panel">
					<div class="panel-title code-title">エクスポートコード</div>
					<div class="code-section">
						<div class="code-section-title">作成したグラデーション</div>
						<div class="export-code" id="exportCode"></div>
					</div>
					<div class="code-section">
						<div class="code-section-title">コード例：グラデーション定義</div>
						<div class="export-code" id="svgCode"></div>
					</div>
					<div class="code-section">
						<div class="code-section-title">コード例：チャートへの適用</div>
						<div class="export-code" id="applyCode"></div>
					</div>
				</section>
			</div>
		</div>

	</main>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.6/d3.min.js" charset="utf-8"></script>
	<script src="https://auth.dataviz.jp/lib/supabase.js"></script>
	<script src="https://auth.dataviz.jp/lib/dataviz-auth-client.js"></script>
	<script type="module" src="script.js"></script>
</body>

</html>
